[workspace]
resolver = "2"
members = ["crates/gist-core", "crates/gist-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gist-core = { path = "crates/gist-core" }
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.55", default-features = false }
git2 = { version = "0.21", default-features = false }
ignore = "0.4"
include_dir = "0.7"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
similar = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
